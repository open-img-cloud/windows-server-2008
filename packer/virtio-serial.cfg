# QEMU configuration (-readconfig): the guest agent channel of the
# instances, so that the VirtIO serial driver is bound to a device during the
# build and the agent can be checked there. Devices declared with -device in
# qemuargs would replace the disk and network devices of Packer.
[chardev "qga0"]
  backend = "null"

[device "vser0"]
  driver = "virtio-serial-pci"

[device "qgaport"]
  driver = "virtserialport"
  chardev = "qga0"
  name = "org.qemu.guest_agent.0"
